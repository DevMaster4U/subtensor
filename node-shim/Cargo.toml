[package]
name = "subtensor-node-shim"
version = "0.1.0"
edition.workspace = true
license = "Unlicense"
publish = false
description = "Node-side IPC server and control RPC for external bots"

[lints]
workspace = true

[dependencies]
codec = { workspace = true, features = ["std"] }
log.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
jsonrpsee = { workspace = true, features = ["server", "macros"] }
tokio = { workspace = true, features = ["time", "rt", "rt-multi-thread", "net", "sync", "io-util"] }

subtensor-ipc = { workspace = true }

sc-service.workspace = true
sc-tracing.workspace = true
sc-transaction-pool-api.workspace = true
sc-network.workspace = true
sc-network-sync.workspace = true
sc-network-transactions.workspace = true
sp-runtime.workspace = true
sp-core.workspace = true
sp-blockchain.workspace = true
sp-consensus-aura = { workspace = true, features = ["std"] }

frame-support = { workspace = true, features = ["std"] }

hex.workspace = true

node-subtensor-runtime = { workspace = true, features = ["std"] }
pallet-ethereum = { workspace = true, features = ["std"] }
