[package]
name = "subtensor-bot"
version = "0.1.0"
edition.workspace = true
license = "Unlicense"
publish = false

[lints]
workspace = true

[dependencies]
codec = { workspace = true, features = ["std"] }
log.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
jsonrpsee = { workspace = true, features = ["server", "macros"] }
tokio = { workspace = true, features = ["time", "rt", "rt-multi-thread", "net", "sync"] }

# Substrate client
sc-client-api.workspace = true
sc-service.workspace = true
sc-transaction-pool-api.workspace = true
sc-network = { workspace = true, features = ["std"] }
sc-network-sync.workspace = true
sc-network-transactions.workspace = true
sp-runtime.workspace = true
sp-core.workspace = true
sp-api.workspace = true
sp-blockchain.workspace = true
sp-consensus-aura = { workspace = true, features = ["std"] }

# Ethereum / Frontier
ethereum.workspace = true
ethereum-types = { version = "0.15.1" }
pallet-ethereum.workspace = true
fp-rpc.workspace = true

# Signing
hex.workspace = true
k256 = { version = "0.13.4", features = ["ecdsa", "arithmetic"] }
dotenvy = "0.15"

# Runtime (for TransactionConverter + EthereumRuntimeRPCApi)
node-subtensor-runtime = { workspace = true, features = ["std"] }
