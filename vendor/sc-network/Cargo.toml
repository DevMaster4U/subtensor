[package]
description = "Substrate network protocol (patched: emit libp2p ping RTT on Event stream)"
name = "sc-network"
version = "0.51.1"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
edition = "2021"
publish = false
documentation = "https://docs.rs/sc-network"
readme = "README.md"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[[bench]]
name = "notifications_protocol"
harness = false

[[bench]]
name = "request_response_protocol"
harness = false

[dependencies]
array-bytes = { version = "6.2.2", default-features = true }
async-channel = { version = "1.8.0" }
async-trait = { version = "0.1.88" }
asynchronous-codec = { version = "0.6" }
bytes = { version = "1.4.0", default-features = true }
cid = { version = "0.9.0" }
codec = { package = "parity-scale-codec", version = "3.7.5", features = ["derive"], default-features = true }
either = { version = "1.8.1", default-features = true }
fnv = { version = "1.0.6" }
futures = { version = "0.3.31" }
futures-timer = { version = "3.0.2" }
ip_network = { version = "0.4.1" }
libp2p = { version = "0.54.1", features = ["dns", "identify", "kad", "macros", "mdns", "noise", "ping", "request-response", "tcp", "tokio", "websocket", "yamux"] }
linked_hash_set = { version = "0.1.4" }
litep2p = { version = "0.9.5", features = ["websocket"] }
log = { version = "0.4.22", default-features = true }
mockall = { version = "0.13.1" }
parking_lot = { version = "0.12.1", default-features = true }
partial_sort = { version = "0.2.0" }
pin-project = { version = "1.1.3" }
prometheus-endpoint = { package = "substrate-prometheus-endpoint", git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
prost = { version = "0.12.4" }
rand = { version = "0.8.5", default-features = true }
sc-client-api = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sc-network-common = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sc-network-types = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sc-utils = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
schnellru = { version = "0.2.3" }
serde = { version = "1.0.214", features = ["derive"], default-features = true }
serde_json = { version = "1.0.132", default-features = true }
smallvec = { version = "1.11.0", default-features = true }
sp-arithmetic = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sp-blockchain = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sp-core = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sp-runtime = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
thiserror = { version = "1.0.64" }
tokio = { version = "1.45.0", features = ["macros", "sync"], default-features = true }
tokio-stream = { version = "0.1.14" }
unsigned-varint = { version = "0.7.2", features = ["asynchronous_codec", "futures"] }
void = { version = "1.0.2" }
wasm-timer = { version = "0.2.5" }
zeroize = { version = "1.7.0", default-features = true }

[dev-dependencies]
assert_matches = { version = "1.5.0" }
mockall = { version = "0.13.1" }
multistream-select = { version = "0.13.0" }
rand = { version = "0.8.5", default-features = true }
sc-block-builder = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sp-consensus = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sp-crypto-hashing = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sp-tracing = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
substrate-test-runtime = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7" }
substrate-test-runtime-client = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7" }
tempfile = { version = "3.8.1" }
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread"], default-features = true }
tokio-util = { version = "0.7.8", features = ["compat"] }
criterion = { version = "0.5.1", default-features = true, features = ["async_tokio"] }

[build-dependencies]
prost-build = { version = "0.13.2" }

[features]
default = []
