[package]
description = "Substrate network protocol (patched: PEER_MAP connection logging)"
name = "sc-network"
version = "0.51.1"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2021"
homepage = "https://substrate.io"
repository = "https://github.com/paritytech/polkadot-sdk"
documentation = "https://docs.rs/sc-network"
readme = "README.md"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
array-bytes = { version = "6.2.3", default-features = true }
async-channel = { version = "1.9.0" }
async-trait = { version = "0.1" }
asynchronous-codec = { version = "0.6.2" }
bytes = { version = "1.4.0", default-features = true }
cid = { version = "0.9.0" }
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = true, features = ["derive"] }
either = { version = "1.8.1", default-features = true }
fnv = { version = "1.0.6" }
futures = { version = "0.3.31" }
futures-timer = { version = "3.0.2" }
ip_network = { version = "0.4.1" }
libp2p = { version = "0.54.1", default-features = true, features = ["dns", "identify", "kad", "macros", "mdns", "noise", "ping", "request-response", "tcp", "tokio", "websocket", "yamux"] }
linked_hash_set = { version = "0.1.5" }
litep2p = { version = "0.9.5", default-features = true }
log = { version = "0.4.22", default-features = true }
mockall = { version = "0.13.1" }
parking_lot = { version = "0.12.5", default-features = true }
partial_sort = { version = "0.2.0" }
pin-project = { version = "1.1.3" }
prometheus-endpoint = { package = "substrate-prometheus-endpoint", git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
prost = { version = "0.12.6" }
rand = { version = "0.8.5", default-features = true }
sc-client-api = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sc-network-common = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sc-network-types = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sc-utils = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
schnellru = { version = "0.2.4" }
serde = { version = "1.0.214", default-features = true, features = ["derive"] }
serde_json = { version = "1.0.132", default-features = true }
smallvec = { version = "1.13.2", default-features = true }
sp-arithmetic = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sp-blockchain = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sp-core = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
sp-runtime = { git = "https://github.com/opentensor/polkadot-sdk.git", rev = "7cc54bf2d50ae3921d718736dfeb0de9468539c7", default-features = true }
thiserror = { version = "1.0.69" }
tokio = { version = "1.41.0", default-features = true, features = ["macros", "sync"] }
tokio-stream = { version = "0.1.16" }
unsigned-varint = { version = "0.7.2", features = ["asynchronous_codec", "futures"] }
void = { version = "1.0.2" }
wasm-timer = { version = "0.2.5" }
zeroize = { version = "1.7.0", default-features = true }

[build-dependencies]
prost-build = { version = "0.13.2" }

[features]
default = ["std"]
std = []
